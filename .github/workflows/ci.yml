name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Generate and verify
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0 generate -f db/sqlc.yaml
          go generate ./...
          git diff --exit-code -- internal/adapters/sqlite/sqlc
          git diff --exit-code -- internal/adapters/sqlite/sqlc.manifest
          sh scripts/check-sqlc-generated.sh
          git diff --exit-code -- internal/scanner/environment.md
      - name: Build outside source tree
        run: |
          mkdir -p "$RUNNER_TEMP/talaria-mem"
          go build -o "$RUNNER_TEMP/talaria-mem/talaria-mem" ./cmd/talaria-mem
      - name: Vacuum lint and bundle
        run: |
          if test -f api/openapi/talaria.yaml; then
            vacuum lint api/openapi/talaria.yaml api/openapi/vacuum.yaml
            vacuum bundle api/openapi/talaria.yaml -o "$RUNNER_TEMP/talaria.openapi.yaml"
          fi
