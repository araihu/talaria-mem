version: "2"
sql:
  - engine: "sqlite"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "sqlc"
        out: "../internal/adapters/sqlite/sqlc"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        sql_package: "database/sql"
